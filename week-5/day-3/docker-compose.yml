version: '3.8'

services:
  # First backend instance
  backend1:
    build: ./backend
    container_name: backend1
    networks:
      - app-network

  # Second backend instance
  backend2:
    build: ./backend
    container_name: backend2
    networks:
      - app-network

  # NGINX reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge