events {
    worker_connections 1024;
}

http {
    # Define upstream backend servers (our two backend instances)
    upstream backend-service {
        # Round-robin is the default load balancing method
        server backend1:3000;
        server backend2:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Route /api requests to backend service
        location /api/ {
            proxy_pass http://backend-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Root path - simple welcome message
        location / {
            return 200 'NGINX Reverse Proxy is running! Try /api/health or /api/hello\n';
            add_header Content-Type text/plain;
        }
    }
}