events {
    worker_connections 1024;
}

http {
    # Upstream backend services
    upstream backend-service {
        server backend1:3000;
        server backend2:3000;
    }

    # HTTP Server - Redirect all traffic to HTTPS
    server {
        listen 80;
        server_name myapp.local localhost;

        # Redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS Server - Main configuration
    server {
        listen 443 ssl http2;
        server_name myapp.local localhost;

        # SSL Certificate Configuration
        ssl_certificate /etc/nginx/certs/myapp.local.pem;
        ssl_certificate_key /etc/nginx/certs/myapp.local-key.pem;

        # Modern SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Root location
        location / {
            return 200 '🔒 Secure NGINX Proxy\n\nEndpoints:\n  - GET  /api/health\n  - GET  /api/data\n  - POST /api/login\n\nHTTPS is working!\n';
            add_header Content-Type text/plain;
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://backend-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}