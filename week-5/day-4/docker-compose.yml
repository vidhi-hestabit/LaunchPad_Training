version: '3.8'

services:
  # Backend instance 1
  backend1:
    build: ./backend
    container_name: backend1
    networks:
      - app-network
    restart: unless-stopped

  # Backend instance 2
  backend2:
    build: ./backend
    container_name: backend2
    networks:
      - app-network
    restart: unless-stopped

  # NGINX Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: nginx-https
    ports:
      - "8080:80"    # HTTP (will redirect to HTTPS)
      - "443:443"  # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge